<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#"><i class="bi bi-lightning-charge"></i> Electric Bill Calculator</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house"></i> HOME</a></li>
        <li class="nav-item"><a class="nav-link active" href="calculator.html"><i class="bi bi-calculator"></i> CALCULATOR</a></li>
        <li class="nav-item"><a class="nav-link" href="result.html"><i class="bi bi-graph-up"></i> RESULT</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> DASHBOARD</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person-circle"></i> PROFILE PAGE</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i> LOGIN / REGISTER</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <form class="calculator-box">
    <label for="month">Month:</label>
    <input type="text" id="month" name="month" placeholder="Enter month">

    <label for="power">Power Consumption (kWh):</label>
    <input type="number" id="power" name="power" placeholder="Enter kWh">

    <label for="cost">Cost Per kWh:</label>
    <input type="number" id="cost" name="cost" placeholder="Enter cost">

    <button type="button" class="btn btn-primary" id="calcBtn">Calculate</button>
    <h3 id="result"></h3>
  </form>
</div>
<script src="script.js"></script>

</body>
</html>
