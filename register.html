<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Electric Bill Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#"><i class="bi bi-lightning-charge"></i> Electric Bill Calculator</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">PROFILE PAGE</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">DASHBOARD</a></li>
        <li class="nav-item"><a class="nav-link" href="calculator.html">CALCULATOR</a></li>
        <li class="nav-item"><a class="nav-link" href="result.html">RESULT</a></li>
        <li class="nav-item"><a class="nav-link active" href="login.html">LOGIN / REGISTER</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="login-page">
  <div class="login-container">
    <div class="login-box">
      <h1 class="login-title">REGISTER</h1>
      <form>
        <div class="form-group">
          <label for="reg-name">Full Name:</label>
          <input type="text" class="form-control" id="reg-name" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email:</label>
          <input type="email" class="form-control" id="reg-email" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password:</label>
          <input type="password" class="form-control" id="reg-password" required>
        </div>
        <div class="form-group">
          <label for="reg-confirm-password">Confirm Password:</label>
          <input type="password" class="form-control" id="reg-confirm-password" required>
        </div>
        <button type="submit" class="btn-login">REGISTER</button>
        <div class="text-center"><a href="login.html" class="forgot-password">Already have an account? Login</a></div>
      </form>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
